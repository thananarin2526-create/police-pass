services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: policepass
      POSTGRES_PASSWORD: policepass
      POSTGRES_DB: policepass
    volumes:
      - policepass_pg_v11:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U policepass"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://policepass:policepass@db:5432/policepass
      JWT_ACCESS_SECRET: change-this-access-secret
    ports:
      - "3000:3000"
    command: sh -c "node src/db/init.js && node src/db/seed.js && npm start"
volumes:
  policepass_pg_v11:
